openapi: 3.1.0
info:
  title: Groucho Project API
  version: 0.1.0
  description: |
    Public HTTP API for gatekeeper sessions. **Project scope** is resolved from the
    `Authorization: Bearer gk_*` API key.

    Behaviour is aligned with the reference implementation in `POST /api/chat`
    ([app/api/chat/route.ts](../../app/api/chat/route.ts)): client-supplied opaque
    `sessionId`, first user message creates the server session, scoring is applied
    to each user turn, assistant reply may conclude the session.

servers:
  - url: https://api.groucho.example.com
    description: Production (placeholder host)
  - url: http://localhost:3000
    description: Local Next.js — Project API under `/v1`; legacy chat remains at `POST /api/chat`

tags:
  - name: Sessions
    description: Chat turns and outcomes
  - name: Access
    description: Post-pass email capture
  - name: Applications
    description: |
      Review applications from your own app. These endpoints need an **applications** API key,
      created in Groucho under the project's Keys & webhooks. Use it only from your server —
      never behind a browser-facing proxy. Conversation keys get `403`.
  - name: Entries
    description: Drop entries without a conversation. Uses a conversations key.
  - name: Cohorts
    description: Groups of approved applicants (ballot pool, guaranteed places, winners). Applications key.

security:
  - bearerAuth: []

paths:
  /v1/sessions/{sessionId}/messages:
    post:
      tags: [Sessions]
      summary: Send a user message and receive the assistant reply
      description: |
        Idempotent session binding: the first successful call for a new
        `sessionId` creates a session row; subsequent calls append messages.

        If the session is already **concluded** (pass / redirect / reject), returns **409**.
      operationId: postSessionMessage
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Opaque client-generated session identifier (UUID recommended).
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostMessageRequest"
            examples:
              default:
                value:
                  message: "Hey."
                  personaId: null
                  applicant:
                    email: "applicant@example.com"
                    name: "Applicant Name"
      responses:
        "200":
          description: Assistant reply and session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostMessageResponse"
        "400":
          description: Invalid body or missing fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid API key
        "409":
          description: Session already concluded — client should start a new session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Upstream scorer or LLM unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/sessions/{sessionId}/start:
    post:
      tags: [Sessions]
      summary: Bootstrap a session (Groucho speaks first)
      description: |
        Idempotent: creates the session and assistant opener when missing, or returns
        the latest assistant message for an active session. The response sets
        `resumed: true` when it restored an existing active session so clients can
        ask whether to continue or start over before revealing the saved question.

        - **gatekeeper** — persists the application opening message (project config, or optional `openingMessage` in the request body).
        - **onboarding** — persists welcome + first question and returns `currentStep`.
      operationId: startSession
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                personaId:
                  type: string
                  format: uuid
                  nullable: true
                applicant:
                  $ref: "#/components/schemas/ApplicantIdentity"
                invitationToken:
                  type: string
                  description: Server-side application invitation token. Required for invitation-only projects; fixes the session, email and application audience.
                openingMessage:
                  type: string
                  maxLength: 500
                  description: |
                    Optional gatekeeper opener for new sessions. Overrides the project's
                    `application_experience.opening_message` when the session is first created.
                    Ignored when resuming an active session that already has an opener.
                openingInteraction:
                  $ref: "#/components/schemas/OpeningInteraction"
      responses:
        "200":
          description: Session started or resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartSessionResponse"
        "400":
          description: Invalid request or missing applicant identity
        "409":
          description: Session already concluded

  /v1/sessions/{sessionId}:
    get:
      tags: [Sessions]
      summary: Get session metadata and latest outcome (optional v1)
      operationId: getSession
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Session record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Unknown session for this project

  /v1/sessions/{sessionId}/access:
    post:
      tags: [Access]
      summary: Submit email after recorded client approval
      description: |
        Aligns with [app/api/access/route.ts](../../app/api/access/route.ts):
        server verifies either an explicit human approval or a client-enabled
        automatic approval and its access secret before upserting profile.
        Groucho's model output alone cannot grant access.
        **Must not** leak whether email already exists.
      operationId: postSessionAccess
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                secret:
                  type: string
                  format: uuid
                  description: Required for gatekeeper access; issued by the human or client-policy approval action. Optional in the compatibility schema for non-gatekeeper integrations.
      responses:
        "200":
          description: Accepted
        "400":
          description: Invalid email or missing secret
        "403":
          description: Session not eligible for email capture
        "429":
          description: Rate limited

  /v1/applications:
    get:
      tags: [Applications]
      summary: List applications with Groucho's assessment
      operationId: listApplications
      parameters:
        - name: queue
          in: query
          schema:
            type: string
            enum: [ready_for_review, awaiting_assessment, in_progress, approved, declined, abandoned, all]
            default: ready_for_review
        - name: sort
          in: query
          schema:
            type: string
            enum: [suitability, newest, oldest, longest_waiting]
            default: suitability
        - name: q
          in: query
          description: Search name, email or artist name.
          schema: { type: string }
        - name: audience
          in: query
          schema: { type: string, enum: [community, artist, all], default: all }
        - name: recommendation
          in: query
          schema: { type: string, enum: [recommend, human_review, decline, all], default: all }
        - name: from
          in: query
          description: Submitted on or after this date (YYYY-MM-DD).
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Submitted on or before this date (YYYY-MM-DD).
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: One page of applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationList"
        "401":
          description: Missing or invalid API key
        "403":
          description: The key is not an applications key

  /v1/applications/{sessionId}:
    get:
      tags: [Applications]
      summary: Get one application with the reviewer report and conversation
      operationId: getApplication
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: The application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
        "403":
          description: The key is not an applications key
        "404":
          description: Unknown application for this project

  /v1/applications/{sessionId}/decision:
    post:
      tags: [Applications]
      summary: Approve or decline an application
      description: |
        Records the decision as made by the reviewer you name, through your app. The first decision
        wins. A reason is required to decline. Groucho then sends `application.decided` to every
        webhook subscribed to it, and an approval returns the access secret for `POST /v1/sessions/{sessionId}/access`.
      operationId: decideApplication
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideApplicationRequest"
      responses:
        "201":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecideApplicationResponse"
        "400":
          description: Invalid decision, missing decline reason or invalid reviewer email
        "403":
          description: The key is not an applications key
        "404":
          description: Unknown application for this project
        "409":
          description: Not finished yet, or a decision has already been recorded

  /v1/applications/{sessionId}/correction:
    post:
      tags: [Applications]
      summary: Correct a decision
      description: |
        Replaces the current decision with a new one, with a reason. The old decision stays in the
        history. Groucho sends `application.decision_corrected`; telling the applicant is up to you.
        Approved → declined revokes the access secret; declined → approved returns a new one.
      operationId: correctApplication
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrectApplicationRequest"
      responses:
        "201":
          description: Correction recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorrectApplicationResponse"
        "400":
          description: Invalid decision, missing reason or invalid reviewer email
        "404":
          description: Unknown application, or nothing decided yet
        "409":
          description: The decision changed since `expectedDecisionId` was read
        "422":
          description: The correction doesn't change the decision

  /v1/applications/{sessionId}/outcomes:
    post:
      tags: [Applications]
      summary: Report what happened after the decision
      description: |
        Tell Groucho whether the person was invited, joined and took part. Groucho uses this to
        measure whether the people it recommends actually join. Reporting the same outcome with the
        same `occurredAt` again is ignored.
      operationId: reportApplicationOutcome
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportOutcomeRequest"
      responses:
        "201":
          description: Outcome recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportOutcomeResponse"
        "200":
          description: Already reported; ignored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportOutcomeResponse"
        "400":
          description: Unknown outcome or invalid occurredAt
        "409":
          description: The application hasn't been decided yet

  /v1/entries:
    post:
      tags: [Entries]
      summary: Submit a drop entry
      description: |
        Records an entry without a conversation: email, name, phone, social links and the drop's own
        fields (size, city...). Use a conversations key from your server or proxy. Sending the same
        `sessionId` again returns the first entry. Entries are reviewed in Groucho, where duplicates
        across email, phone and social accounts are flagged.
      operationId: submitEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitEntryRequest"
      responses:
        "201":
          description: Entry recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitEntryResponse"
        "200":
          description: Already entered with this sessionId; nothing changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitEntryResponse"
        "400":
          description: Invalid email, phone, socials or fields
        "409":
          description: Entries are closed or not open yet, or the sessionId belongs to a conversation

  /v1/cohorts:
    get:
      tags: [Cohorts]
      summary: List cohorts
      description: The current round's cohorts, such as a ballot pool, guaranteed places and winners. Server only (applications key).
      operationId: listCohorts
      responses:
        "200":
          description: Cohorts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohortList"

  /v1/cohorts/{cohortId}/members:
    post:
      tags: [Cohorts]
      summary: Place people in a cohort
      description: |
        Put approved applicants in a cohort, for example the winners of a ballot you ran yourself.
        People already in another cohort this round move here. Each move is sent as
        `application.allocated`. Server only (applications key).
      operationId: addToCohort
      parameters:
        - name: cohortId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToCohortRequest"
      responses:
        "200":
          description: People placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddToCohortResponse"
        "404":
          description: Unknown cohort, or some sessionIds weren't found (listed in `unknown`)
        "409":
          description: The cohort is full
        "422":
          description: Someone isn't approved
        "423":
          description: The cohort is locked

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: gk_live_ or gk_test_

  parameters:
    sessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string

  schemas:
    ApplicantIdentity:
      type: object
      required: [email]
      description: First-class applicant contact captured outside configurable flow/profile answers.
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        name:
          type: string
          maxLength: 160
        details:
          $ref: "#/components/schemas/ApplicantDetails"
        artist:
          $ref: "#/components/schemas/ArtistApplicantProfile"

    ArtistApplicantProfile:
      $ref: "#/components/schemas/ApplicantDetails"

    ApplicantDetails:
      type: object
      required: [city, age, socialLinks, musicLinks]
      description: Applicant-supplied facts for either application audience; use details for community or artist for artist applications, never both. Name is required on the parent applicant when this object is present. Empty link lists are valid.
      properties:
        city:
          type: string
          minLength: 1
          maxLength: 120
        age:
          type: integer
          minimum: 0
          maximum: 120
        artistName:
          type: string
          maxLength: 160
        socialLinks:
          type: array
          maxItems: 8
          items:
            type: string
            format: uri
            maxLength: 2048
        musicLinks:
          type: array
          maxItems: 8
          items:
            type: string
            format: uri
            maxLength: 2048

    PostMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: User message for this turn
          minLength: 1
          maxLength: 8000
        personaId:
          type: string
          format: uuid
          nullable: true
          description: Optional persona override; must belong to the same project and be active.
        applicant:
          $ref: "#/components/schemas/ApplicantIdentity"
        interactionAnswer:
          $ref: "#/components/schemas/InteractionAnswer"

    ScoreBreakdown:
      type: object
      required: [specificity, authenticity, cultural_depth, overall]
      properties:
        specificity:
          type: number
          minimum: 0
          maximum: 1
        authenticity:
          type: number
          minimum: 0
          maximum: 1
        cultural_depth:
          type: number
          minimum: 0
          maximum: 1
        overall:
          type: number
          minimum: 0
          maximum: 1

    ReviewerReport:
      type: object
      required:
        - applicant_bio
        - advisory_recommendation
        - confidence_score
        - evidence_summary
        - weak_or_missing_signals
        - safety_or_integrity_flags
        - reviewer_focus
      description: Private reviewer-facing applicant report. Advisory only; the host/client owns the decision policy.
      properties:
        applicant_bio:
          type: string
          description: Neutral applicant bio/report summary based on conversation evidence.
        advisory_recommendation:
          type: string
          enum: [recommend, human_review, decline]
          description: Advisory recommendation for the human reviewer.
        confidence_score:
          type: number
          minimum: 0
          maximum: 1
          description: Confidence in the advisory recommendation based on evidence quality.
        evidence_summary:
          type: array
          items:
            type: string
          description: Concrete evidence supporting the advisory recommendation.
        evidence_references:
          type: array
          description: Deterministic links from evidence goals to the exact applicant messages that supplied them. Empty for legacy sessions without source metadata.
          items:
            type: object
            required: [signal_key, signal_label, source_message_id, excerpt]
            properties:
              signal_key:
                type: string
              signal_label:
                type: string
              source_message_id:
                type: string
              excerpt:
                type: string
        evidence_limits:
          type: array
          description: Neutral unknowns and unresolved evidence, separate from decision-relevant gaps. Derived from reconciled coverage; unknowns alone are not concerns.
          items:
            type: object
            required: [signal_key, label, coverage, material_gap, explanation]
            properties:
              signal_key:
                type: string
              label:
                type: string
              coverage:
                type: string
                enum: [partial, unverified]
              material_gap:
                type: boolean
              explanation:
                type: string
        weak_or_missing_signals:
          type: array
          items:
            type: string
          description: Source-linked decision-relevant gaps. Neutral unknowns are listed separately in evidence_limits.
        safety_or_integrity_flags:
          type: array
          items:
            type: string
          description: Contradictions, refusals, repeated avoidance, abusive/discriminatory language, or other reviewer concerns.
        reviewer_focus:
          type: string
          description: What the human reviewer should pay attention to before making the final decision.

    SessionOutcome:
      type: string
      description: >-
        Advisory conversation outcome. It does not approve or decline the application by itself.
        `completed` is returned by the newer COLORS conversation engine, which finishes without an
        outcome of its own; its suitability score and reviewer report follow asynchronously.
      enum:
        - active
        - passed
        - redirected
        - rejected
        - completed

    ApplicationReviewStatus:
      type: string
      description: Client decision lifecycle. Approved or declined is created by a human action or an explicitly enabled deterministic client policy; this—not Groucho's advisory session outcome—controls access.
      enum:
        - not_ready
        - pending
        - approved
        - declined

    ProjectType:
      type: string
      enum: [gatekeeper, onboarding]

    GrouchoIntent:
      type: string
      enum: [probe, clarify, challenge, acknowledge, decide, redirect, reject]

    GrouchoInputType:
      type: string
      enum: [text, voice, singleSelect, multiSelect, ranking, mediaChoice]

    MediaChoiceMode:
      type: string
      enum: [select, remove, rank]

    MediaChoiceVideo:
      type: object
      required: [type, provider, videoId, title, alt]
      properties:
        type:
          type: string
          const: video
        provider:
          type: string
          const: youtube
        videoId:
          type: string
          pattern: "^[A-Za-z0-9_-]{6,20}$"
        title:
          type: string
          maxLength: 160
        artist:
          type: string
          maxLength: 120
        thumbnailUrl:
          type: string
          description: HTTPS or application-relative poster image.
        durationSeconds:
          type: integer
          minimum: 1
        startSeconds:
          type: integer
          minimum: 0
        captionsUrl:
          type: string
          description: Optional HTTPS or application-relative captions resource.
        transcript:
          type: string
          maxLength: 4000
        alt:
          type: string
          maxLength: 240

    MediaChoiceOption:
      type: object
      required: [id, label, media]
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
        label:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 240
        media:
          $ref: "#/components/schemas/MediaChoiceVideo"

    MediaChoiceInteraction:
      type: object
      required: [id, options, selection, rationale]
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
        options:
          type: array
          minItems: 2
          maxItems: 8
          items:
            $ref: "#/components/schemas/MediaChoiceOption"
        selection:
          type: object
          required: [mode, minSelections, maxSelections]
          properties:
            mode:
              $ref: "#/components/schemas/MediaChoiceMode"
            minSelections:
              type: integer
              minimum: 1
            maxSelections:
              type: integer
              minimum: 1
        rationale:
          type: object
          required: [required, prompt, maxLength]
          properties:
            required:
              type: boolean
            prompt:
              type: string
              maxLength: 160
            minLength:
              type: integer
              minimum: 0
            maxLength:
              type: integer
              minimum: 1
              maximum: 2000

    MediaChoiceAnswer:
      type: object
      required: [type, questionId, mode, optionIds]
      properties:
        type:
          type: string
          const: mediaChoice
        questionId:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
        mode:
          $ref: "#/components/schemas/MediaChoiceMode"
        optionIds:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
        rationale:
          type: string
          maxLength: 2000

    InteractionAnswer:
      oneOf:
        - $ref: "#/components/schemas/MediaChoiceAnswer"

    GrouchoEmotionalState:
      type: string
      enum: [neutral, curious, interested, skeptical, evaluating, decisive]

    GrouchoVisualState:
      type: string
      enum: [idle, listening, thinking, curious, interested, evaluating, decision]

    GrouchoInteractionUi:
      type: object
      required: [intent, inputType, emotionalState, visualState]
      properties:
        intent:
          $ref: "#/components/schemas/GrouchoIntent"
        inputType:
          $ref: "#/components/schemas/GrouchoInputType"
        emotionalState:
          $ref: "#/components/schemas/GrouchoEmotionalState"
        visualState:
          $ref: "#/components/schemas/GrouchoVisualState"
        options:
          type: array
          items:
            type: string
        mediaChoice:
          $ref: "#/components/schemas/MediaChoiceInteraction"

    OpeningInteraction:
      type: object
      required: [inputType]
      properties:
        inputType:
          type: string
          enum: [text, singleSelect, multiSelect, mediaChoice]
        options:
          type: array
          items:
            type: string
          description: Required when `inputType` is `singleSelect` or `multiSelect`
        mediaChoice:
          allOf:
            - $ref: "#/components/schemas/MediaChoiceInteraction"
          description: Required when `inputType` is `mediaChoice`.

    OnboardingCurrentStep:
      type: object
      required: [id, title, index, total]
      properties:
        id:
          type: string
        title:
          type: string
        index:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 1
        interaction:
          $ref: "#/components/schemas/OpeningInteraction"
          description: Optional input control for this onboarding step.

    OnboardingFlags:
      type: object
      properties:
        followup:
          type: boolean
        boundary:
          type: boolean

    StartSessionResponse:
      type: object
      required: [message, status, projectType]
      properties:
        message:
          type: string
        status:
          type: string
          enum: [active]
        projectType:
          $ref: "#/components/schemas/ProjectType"
        ui:
          $ref: "#/components/schemas/GrouchoInteractionUi"
        flowVersion:
          type: string
        welcomeMessage:
          type: string
        currentStep:
          $ref: "#/components/schemas/OnboardingCurrentStep"
        stepHint:
          type: string
          description: Host UI placeholder for the active step
        bootstrapped:
          type: boolean
        resumed:
          type: boolean
          description: True when this start call restored an existing active session.

    SessionMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string

    PostMessageResponse:
      type: object
      required: [message, status, scores]
      properties:
        message:
          type: string
          description: Assistant text for this turn. Terminal application turns return the configured neutral closing message, while `status` carries the internal outcome.
        status:
          $ref: "#/components/schemas/SessionOutcome"
        reviewStatus:
          $ref: "#/components/schemas/ApplicationReviewStatus"
        scores:
          allOf:
            - $ref: "#/components/schemas/ScoreBreakdown"
          description: >-
            Per-turn assessment. The newer COLORS engine does not score turns and returns a neutral
            0.5 placeholder; read `suitabilityScore` from the completed session instead.
        suitabilityScore:
          type: number
          minimum: 0
          maximum: 1
          description: Groucho's overall suitability score, before the client decision policy is applied.
        suitabilityBand:
          type: string
          enum: [recommended_acceptance, review, below_threshold]
          description: Score band produced by the client's configured thresholds.
        ui:
          $ref: "#/components/schemas/GrouchoInteractionUi"
          description: V2 interaction spec for client rendering (gatekeeper turns)
        secret:
          type: string
          format: uuid
          description: Issued when the client policy automatically approves the application. Human-review approvals issue this through the admin decision endpoint.
        profile:
          allOf:
            - $ref: "#/components/schemas/Profile"
          description: Optional compatibility field. Terminal profile extraction runs asynchronously; read the completed session to retrieve the persisted profile.
        reviewerReport:
          allOf:
            - $ref: "#/components/schemas/ReviewerReport"
          description: Private reviewer-facing report produced on terminal gatekeeper turns when available.
        projectType:
          $ref: "#/components/schemas/ProjectType"
        flowVersion:
          type: string
          description: Onboarding flow_config version snapshot for this session
        currentStep:
          $ref: "#/components/schemas/OnboardingCurrentStep"
          description: Present while onboarding session is active
        stepHint:
          type: string
          description: Host UI placeholder for the active onboarding step
        onboardingFlags:
          $ref: "#/components/schemas/OnboardingFlags"
        welcomeMessage:
          type: string
          description: Project welcome line shown before the first question

    Session:
      type: object
      properties:
        message:
          type: string
          description: Last applicant-facing closing message, available for concluded gatekeeper sessions so a host can restore submission confirmation.
        ui:
          $ref: "#/components/schemas/GrouchoInteractionUi"
        id:
          type: string
          format: uuid
        clientSessionKey:
          type: string
          description: Same as path `sessionId`
        status:
          $ref: "#/components/schemas/SessionOutcome"
        outcome:
          type: string
          enum: [PASS, REDIRECT, REJECT]
          nullable: true
          description: Set when session completes; may mirror normalised `status`
        reviewStatus:
          $ref: "#/components/schemas/ApplicationReviewStatus"
        suitabilityScore:
          type: number
          minimum: 0
          maximum: 1
          description: Final Groucho suitability score, before client policy.
        suitabilityBand:
          type: string
          enum: [recommended_acceptance, review, below_threshold]
        secret:
          type: string
          format: uuid
          description: Returned for a client-policy approval so the applicant flow can continue.
        turnsUsed:
          type: integer
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        applicant:
          $ref: "#/components/schemas/ApplicantIdentity"
        profile:
          allOf:
            - $ref: "#/components/schemas/Profile"
          description: Structured profile from the latest verdict; present after asynchronous terminal completion finishes.
        reviewerReport:
          allOf:
            - $ref: "#/components/schemas/ReviewerReport"
          description: Private reviewer-facing report from the latest verdict, when available.
        projectType:
          $ref: "#/components/schemas/ProjectType"
        flowVersion:
          type: string
          nullable: true
        currentStep:
          allOf:
            - $ref: "#/components/schemas/OnboardingCurrentStep"
          nullable: true
          description: Active onboarding step while session status is active
        welcomeMessage:
          type: string
          nullable: true
        stepHint:
          type: string
          nullable: true
        messages:
          type: array
          items:
            $ref: "#/components/schemas/SessionMessage"
          description: Transcript for active onboarding sessions (capped)

    ProfileCore:
      type: object
      required:
        - summary
        - sentiment
        - engagement
        - language
        - intent_tags
        - interests
        - risk_flags
        - qa
        - confidence
      properties:
        summary:
          type: string
          maxLength: 280
          description: Short summary. Emails and phone numbers are auto-redacted.
        sentiment:
          type: string
          enum: [positive, neutral, negative]
        engagement:
          type: string
          enum: [high, medium, low]
        language:
          type: string
          description: BCP-47 code (e.g. `en`, `fr`)
        intent_tags:
          type: array
          items: { type: string }
          maxItems: 5
        interests:
          type: array
          items: { type: string }
          maxItems: 10
        risk_flags:
          type: array
          items: { type: string }
        qa:
          type: array
          items:
            type: object
            required: [question, answer]
            properties:
              question: { type: string }
              answer: { type: string }
        confidence:
          type: number
          minimum: 0
          maximum: 1

    ProfileExtraction:
      type: object
      required: [model, status]
      properties:
        model: { type: string }
        status:
          type: string
          enum: [ok, failed]
        reason:
          type: string
          description: Present when `status` is `failed`.

    Profile:
      type: object
      required: [schema_version, extraction]
      description: |
        Structured profile extracted on terminal session outcomes. `core` follows the
        platform-versioned shape; `custom` is brand-defined via the persona's
        `profile_schema` (only declared keys are kept). See
        [profile-payload.schema.json](../profile-payload.schema.json).
      properties:
        schema_version:
          type: integer
          enum: [1]
        core:
          allOf:
            - $ref: "#/components/schemas/ProfileCore"
          nullable: true
        custom:
          type: object
          nullable: true
          additionalProperties: true
        extraction:
          $ref: "#/components/schemas/ProfileExtraction"

    ApplicationQueue:
      type: string
      enum: [ready_for_review, awaiting_assessment, in_progress, approved, declined, abandoned]

    ApplicationDecisionSummary:
      type: object
      required: [decision, source, via, reviewerEmail, reason, applicantReason, corrected, decidedAt]
      properties:
        decision:
          type: string
          enum: [approved, declined]
        source:
          type: [string, "null"]
          enum: [human, policy, null]
        via:
          type: string
          enum: [dashboard, api, policy]
          description: Where the decision was made — the Groucho dashboard, your app through the API, or your automatic decision policy.
        reviewerEmail:
          type: [string, "null"]
        reason:
          type: [string, "null"]
        applicantReason:
          type: [string, "null"]
        corrected:
          type: boolean
        decidedAt:
          type: [string, "null"]
          format: date-time

    Application:
      type: object
      required: [sessionId, status, queue, reviewStatus, submittedAt, updatedAt, applicant, assessment, decision, latestOutcome]
      properties:
        sessionId:
          type: string
          description: Your session key.
        status:
          type: string
        queue:
          $ref: "#/components/schemas/ApplicationQueue"
        reviewStatus:
          type: string
          enum: [not_ready, pending, approved, declined]
        submittedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        applicant:
          type: object
          required: [name, email, audience, artistName, city, age, socialLinks, musicLinks]
          properties:
            name: { type: [string, "null"] }
            email: { type: [string, "null"] }
            audience: { type: string, enum: [community, artist] }
            artistName: { type: [string, "null"] }
            city: { type: [string, "null"] }
            age: { type: [number, "null"] }
            socialLinks: { type: array, items: { type: string } }
            musicLinks: { type: array, items: { type: string } }
        assessment:
          type: object
          required: [suitabilityScore, suitabilityBand, recommendation, confidence]
          properties:
            suitabilityScore: { type: [number, "null"] }
            suitabilityBand: { type: [string, "null"] }
            recommendation:
              type: [string, "null"]
              enum: [recommend, human_review, decline, null]
            confidence: { type: [number, "null"] }
        decision:
          oneOf:
            - $ref: "#/components/schemas/ApplicationDecisionSummary"
            - type: "null"
        latestOutcome:
          description: The latest outcome you reported.
          oneOf:
            - type: object
              required: [outcome, occurredAt]
              properties:
                outcome: { $ref: "#/components/schemas/ApplicationOutcome" }
                occurredAt: { type: [string, "null"], format: date-time }
            - type: "null"

    ApplicationList:
      type: object
      required: [applications, total, counts, offset, limit]
      properties:
        applications:
          type: array
          items:
            $ref: "#/components/schemas/Application"
        total:
          type: integer
        counts:
          type: object
          description: Applications in each queue (and `all`) for the same filters.
          additionalProperties:
            type: integer
        offset:
          type: integer
        limit:
          type: integer

    ApplicationDetail:
      type: object
      required: [application, reviewerReport, transcript, decisions, outcomes]
      properties:
        application:
          $ref: "#/components/schemas/Application"
        reviewerReport:
          description: Groucho's report for reviewers, once the conversation has finished.
          oneOf:
            - $ref: "#/components/schemas/ReviewerReport"
            - type: "null"
        transcript:
          type: array
          items:
            type: object
            required: [role, content, sentAt]
            properties:
              role: { type: string, enum: [applicant, groucho] }
              content: { type: string }
              sentAt: { type: string, format: date-time }
        decisions:
          description: Every decision, oldest first, including corrections.
          type: array
          items:
            $ref: "#/components/schemas/DecisionHistoryEntry"
        outcomes:
          type: array
          items:
            type: object
            required: [outcome, occurredAt, note]
            properties:
              outcome: { $ref: "#/components/schemas/ApplicationOutcome" }
              occurredAt: { type: string, format: date-time }
              note: { type: [string, "null"] }

    DecideApplicationRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, declined]
        reason:
          type: string
          maxLength: 1200
          description: Required when declining. An internal note for your team.
        applicantReason:
          type: string
          maxLength: 1200
          description: A reason you may share with the applicant. Groucho never sends it to them.
        reviewer:
          type: object
          description: The person in your app who made the decision. Shown in the Groucho dashboard and webhooks.
          properties:
            email: { type: string, format: email }
            name: { type: string }

    DecideApplicationResponse:
      type: object
      required: [sessionId, reviewStatus, decision]
      properties:
        sessionId:
          type: string
        reviewStatus:
          type: string
          enum: [approved, declined]
        decision:
          type: object
          required: [decision, source, via, reason, decidedAt]
          properties:
            decision: { type: string, enum: [approved, declined] }
            source: { type: string, enum: [human] }
            via: { type: string, enum: [api] }
            reason: { type: [string, "null"] }
            decidedAt: { type: string, format: date-time }
        accessSecret:
          type: string
          format: uuid
          description: Only for approvals. Pass to `POST /v1/sessions/{sessionId}/access`.

    ApplicationOutcome:
      type: string
      enum: [invited, joined, invite_declined, no_response, active, inactive, left, removed]

    DecisionHistoryEntry:
      type: object
      required: [id, decision, source, via, reviewerEmail, reviewerName, reason, applicantReason, decidedAt, correction, current]
      properties:
        id: { type: string }
        decision: { type: string, enum: [approved, declined] }
        source: { type: string, enum: [human, policy] }
        via: { type: string, enum: [dashboard, api, policy] }
        reviewerEmail: { type: [string, "null"] }
        reviewerName: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        applicantReason: { type: [string, "null"] }
        decidedAt: { type: string, format: date-time }
        correction: { type: boolean, description: Whether this decision corrected an earlier one. }
        current: { type: boolean, description: Whether this is the decision in force. }

    CorrectApplicationRequest:
      type: object
      required: [decision, reason]
      properties:
        decision: { type: string, enum: [approved, declined] }
        reason: { type: string, maxLength: 1200, description: Why the decision is being corrected. }
        applicantReason: { type: string, maxLength: 1200, description: A reason you may share with the applicant. }
        expectedDecisionId:
          type: string
          description: The decision you are correcting. If it has changed since, you get 409.
        reviewer:
          type: object
          properties:
            email: { type: string, format: email }
            name: { type: string }

    CorrectApplicationResponse:
      type: object
      required: [sessionId, reviewStatus, decision, replaced]
      properties:
        sessionId: { type: string }
        reviewStatus: { type: string, enum: [approved, declined] }
        decision:
          type: object
          required: [id, decision, source, via, reason, applicantReason, decidedAt]
          properties:
            id: { type: string }
            decision: { type: string, enum: [approved, declined] }
            source: { type: string, enum: [human] }
            via: { type: string, enum: [api] }
            reason: { type: string }
            applicantReason: { type: [string, "null"] }
            decidedAt: { type: string, format: date-time }
        replaced:
          type: object
          required: [id, decision]
          properties:
            id: { type: string }
            decision: { type: string, enum: [approved, declined] }
        accessSecret:
          type: string
          format: uuid
          description: Only when the correction approves.

    ReportOutcomeRequest:
      type: object
      required: [outcome]
      properties:
        outcome:
          $ref: "#/components/schemas/ApplicationOutcome"
        occurredAt:
          type: string
          format: date-time
          description: When it happened. Defaults to now; can't be in the future.
        note:
          type: string
          maxLength: 500

    ReportOutcomeResponse:
      type: object
      required: [sessionId, outcome, occurredAt, duplicate]
      properties:
        sessionId: { type: string }
        outcome:
          $ref: "#/components/schemas/ApplicationOutcome"
        occurredAt: { type: string, format: date-time }
        duplicate: { type: boolean }
        id: { type: string }
        reportedAt: { type: string, format: date-time }

    SubmitEntryRequest:
      type: object
      required: [sessionId, applicant]
      properties:
        sessionId: { type: string, minLength: 8, maxLength: 128, description: Your key for this entry. }
        applicant:
          $ref: "#/components/schemas/ApplicantIdentity"
        phone: { type: string, maxLength: 40 }
        socials:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 300 }
          description: Profile links or handles. Reviewers open these; Groucho flags accounts used on more than one entry.
        fields:
          type: object
          maxProperties: 20
          additionalProperties:
            oneOf: [{ type: string }, { type: number }, { type: boolean }]
          description: 'Drop-specific answers, e.g. `{ "size": "UK 9", "city": "London" }`. Names use letters, numbers and underscores.'

    SubmitEntryResponse:
      type: object
      required: [sessionId, status, duplicate]
      properties:
        sessionId: { type: string }
        status: { type: string, enum: [received] }
        duplicate: { type: boolean, description: True when this sessionId had already entered. }

    Cohort:
      type: object
      required: [id, name, grantsAccess, capacity, members, locked, drawnAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        grantsAccess: { type: boolean, description: Members can use their access secret. }
        capacity: { type: integer, nullable: true }
        members: { type: integer }
        locked: { type: boolean }
        drawnAt: { type: string, format: date-time, nullable: true }

    CohortList:
      type: object
      required: [round, cohorts]
      properties:
        round:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            opensAt: { type: string, format: date-time, nullable: true }
            closesAt: { type: string, format: date-time, nullable: true }
        cohorts:
          type: array
          items:
            $ref: "#/components/schemas/Cohort"

    AddToCohortRequest:
      type: object
      required: [sessionIds]
      properties:
        sessionIds:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string }
          description: Your session ids.
        reason: { type: string, maxLength: 1200 }

    AddToCohortResponse:
      type: object
      required: [runId, moved]
      properties:
        runId: { type: string, format: uuid }
        moved: { type: integer, description: People who changed cohort. Anyone already here isn't counted. }

    Error:
      type: object
      properties:
        error:
          type: string

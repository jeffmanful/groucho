              - paragraph [ref=e386]: Why do you want to be an early applicant for the Forum?
            - paragraph [ref=e396]: I love discovering music and COLORS has always inspired me. I want to meet creative people, learn from the community, and hopefully contribute positive energy as the Forum grows.
            - paragraph [ref=e399]: That makes sense. COLORS has shaped how you listen, and you're drawn to the community side. I'm curious what draws you to COLORS specifically rather than another music community, is there a performance or moment that stuck with you?
            - paragraph [ref=e402]: There have been lots over the years and I cannot remember a particular one right now. I mainly like the stripped-back visual style and the way it introduces me to artists I would not otherwise find.
            - paragraph [ref=e405]: Four recent COLORS shows. You’re shaping a three-performance programme with a clear point of view. Which one do you leave out?
